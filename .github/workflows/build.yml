name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      # Gradle comes from ./gradlew (pinned to 2.14.1, the last version that
      # ForgeGradle 2.1 accepts). Only the JDK is provided by the runner.
      - name: Build
        id: build
        run: |
          set +e
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace > build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            # Surface the real cause as check-run annotations, which are readable
            # over the public API — job logs are not.
            grep -E "\.java:[0-9]+: (error|warning):" build.log | head -25 | while IFS= read -r line; do
              echo "::error title=javac::$line"
            done
            awk '/What went wrong/,/^\* Try/' build.log | head -8 | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=gradle::$line"
            done
            echo "----- tail -----"
            tail -40 build.log
          fi
          exit $rc

      - name: Upload jar
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: bedwars-sniper
          path: build/libs/*.jar
          if-no-files-found: warn

  injector:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Only jni.h is needed from the JDK; jvm.lib is never linked.
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Configure
        shell: pwsh
        run: |
          "JAVA_HOME=$env:JAVA_HOME"
          "jni.h present: $(Test-Path "$env:JAVA_HOME/include/jni.h")"
          cmake -S badlion/native -B native-build -A x64 -DCMAKE_BUILD_TYPE=Release *>&1 |
            Tee-Object -FilePath cfg.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content cfg.log | Select-Object -Last 30 |
              ForEach-Object { Write-Output "::error title=cmake-configure::$_" }
            exit 1
          }

      - name: Build
        shell: pwsh
        run: |
          cmake --build native-build --config Release *>&1 | Tee-Object -FilePath build-native.log
          if ($LASTEXITCODE -ne 0) {
            # Surface the first diagnostics: job logs need auth, annotations do not.
            Select-String -Path build-native.log -Pattern "error|warning C" |
              Select-Object -First 25 |
              ForEach-Object { Write-Output "::error title=msvc::$($_.Line.Trim())" }
            exit 1
          }

      - name: Upload injector
        uses: actions/upload-artifact@v4
        with:
          name: badlion-injector
          path: |
            native-build/bin/inject.exe
            native-build/bin/blagent.dll
          if-no-files-found: error

  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax check
        run: python -m py_compile tools/snipe_engine.py

  loader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Build loader jar
        run: bash badlion/loader/build.sh

      # Compiles a fake 1.8.9 client (notch-named classes, same member shapes)
      # and runs the real loader against it: asserts the sidebar/header parse,
      # the bridge whitelist and the join path.
      - name: Smoke test
        id: smoke
        run: |
          set +e
          bash badlion/loader/test/run.sh > smoke.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            grep -E "FAIL|SMOKE|Exception" smoke.log | head -25 | while IFS= read -r line; do
              echo "::error title=smoke::$line"
            done
            echo "----- tail -----"
            tail -40 smoke.log
          fi
          exit $rc

      - name: Upload loader
        if: steps.smoke.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: blsnip-loader
          path: badlion/loader/build/blsnip-loader.jar
          if-no-files-found: error
