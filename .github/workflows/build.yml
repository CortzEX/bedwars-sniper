name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      # ForgeGradle 2.1 does not work above Gradle 3.x. The MDK ships 2.14.
      - name: Install Gradle 2.14.1
        run: |
          curl -sSLo gradle.zip https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-2.14.1/bin" >> "$GITHUB_PATH"

      - name: Build
        id: build
        run: |
          set +e
          gradle build --no-daemon --stacktrace > build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            # Surface the real cause as check-run annotations, which are readable
            # over the public API — job logs are not.
            grep -E "\.java:[0-9]+: (error|warning):" build.log | head -25 | while IFS= read -r line; do
              echo "::error title=javac::$line"
            done
            awk '/What went wrong/,/^\* Try/' build.log | head -8 | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=gradle::$line"
            done
            echo "----- tail -----"
            tail -40 build.log
          fi
          exit $rc

      - name: Upload jar
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: bedwars-sniper
          path: build/libs/*.jar
          if-no-files-found: warn

  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax check
        run: python -m py_compile tools/snipe_engine.py
